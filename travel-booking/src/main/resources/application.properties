spring.application.name=travel-booking
camel.springboot.name=TravelByCamel

server.address=0.0.0.0
server.port=8085

camel.rest.component=platform-http
camel.rest.host=localhost
camel.rest.port=${server.port}
camel.rest.context-path=/api
camel.rest.binding-mode=json
camel.rest.data-format-property[prettyPrint]=true
camel.rest.enable-cors=true

camel.rest.api-context-path=/api-doc
camel.rest.api-property[openapi.version]=3.1.0
camel.rest.api-property[api.title]=Travel Booking API
camel.rest.api-property[api.version]=1.0.0

camel.dataformat.jackson.pretty-print=true

management.endpoints.web.exposure.include=health

travel.flight.url=http://localhost:8081/soap-api/service/flight
travel.hotel.url=http://localhost:8080/soap-api/service/hotel
travel.payment.host=http://localhost:8083
